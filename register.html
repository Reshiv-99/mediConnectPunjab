<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindtheDoc — Login / Register</title>
  <link rel="stylesheet" href="register.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="reg-container">
  <!-- TABS -->
  <ul class="nav nav-tabs mb-3" id="regTabs" style="border-bottom: 2px solid #9b59b6;">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginPane"
        style="color:#9b59b6;font-weight:600;border:none;background:transparent;">Login</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerPane"
        style="color:#aaa;font-weight:600;border:none;background:transparent;">Register</button>
    </li>
  </ul>

  <div class="tab-content">
    <!-- LOGIN -->
    <div class="tab-pane fade show active" id="loginPane">
      <div class="reg-title">Login</div>
      <div style="margin-top:1.5rem;">
        <div class="input-box" style="width:100%">
          <span class="details">Email</span>
          <input type="email" id="loginEmail" placeholder="you@email.com" required>
        </div>
        <div class="input-box" style="width:100%">
          <span class="details">Password</span>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>
        <div class="button"><input type="button" value="Login" onclick="doLogin()"></div>
        <p id="login-msg" style="text-align:center;font-size:0.9rem;color:#9b59b6;margin-top:-1rem;"></p>
      </div>
    </div>

    <!-- REGISTER -->
    <div class="tab-pane fade" id="registerPane">
      <div class="reg-title">Registration</div>
      <div class="content">
        <div class="user-details">
          <div class="input-box"><span class="details">Full Name</span><input type="text" id="regName" placeholder="Enter your name" required></div>
          <div class="input-box"><span class="details">Username</span><input type="text" id="regUser" placeholder="Enter your username" required></div>
          <div class="input-box"><span class="details">Email</span><input type="email" id="regEmail" placeholder="Enter your email" required></div>
          <div class="input-box"><span class="details">Phone Number</span><input type="tel" id="regPhone" placeholder="Enter your number" required></div>
          <div class="input-box"><span class="details">Password</span><input type="password" id="regPass" placeholder="Enter your password" required></div>
          <div class="input-box"><span class="details">Confirm Password</span><input type="password" id="regPass2" placeholder="Confirm your password" required></div>
        </div>
        <div class="gender-details">
          <input type="radio" name="gender" id="dot-1" value="Male">
          <input type="radio" name="gender" id="dot-2" value="Female">
          <input type="radio" name="gender" id="dot-3" value="Other">
          <span class="gender-title">Gender</span>
          <div class="category">
            <label for="dot-1"><span class="dot one"></span><span class="gender">Male</span></label>
            <label for="dot-2"><span class="dot two"></span><span class="gender">Female</span></label>
            <label for="dot-3"><span class="dot three"></span><span class="gender">Prefer not to say</span></label>
          </div>
        </div>
        <div class="button"><input type="button" value="Register" onclick="doRegister()"></div>
        <p id="reg-msg" style="text-align:center;font-size:0.9rem;color:#9b59b6;margin-top:-1rem;"></p>
      </div>
    </div>
  </div>

  <div class="back-link"><a href="index.html">← Back to Home</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function getUsers()      { return JSON.parse(localStorage.getItem("ftd_users") || "[]"); }
function saveUsers(u)    { localStorage.setItem("ftd_users", JSON.stringify(u)); }
function getCurrentUser(){ return localStorage.getItem("ftd_current_user"); }

function doRegister() {
  var name  = document.getElementById("regName").value.trim();
  var email = document.getElementById("regEmail").value.trim();
  var pass  = document.getElementById("regPass").value;
  var pass2 = document.getElementById("regPass2").value;
  var msg   = document.getElementById("reg-msg");
  if (!name || !email || !pass) { msg.style.color="#f66"; msg.textContent="Please fill all required fields."; return; }
  if (pass !== pass2)           { msg.style.color="#f66"; msg.textContent="Passwords do not match."; return; }
  var users = getUsers();
  if (users.find(function(u){ return u.email===email; })) { msg.style.color="#f66"; msg.textContent="Email already registered."; return; }
  users.push({ name:name, email:email, pass:pass });
  saveUsers(users);
  msg.style.color="#9b59b6"; msg.textContent="Registered successfully! You can now login.";
}

function doLogin() {
  var email = document.getElementById("loginEmail").value.trim();
  var pass  = document.getElementById("loginPass").value;
  var msg   = document.getElementById("login-msg");
  var users = getUsers();
  var user  = users.find(function(u){ return u.email===email && u.pass===pass; });
  if (!user) { msg.style.color="#f66"; msg.textContent="Invalid email or password."; return; }
  localStorage.setItem("ftd_current_user", user.name);
  msg.style.color="#9b59b6"; msg.textContent="Login successful! Redirecting…";
  setTimeout(function(){ window.location.href = "index.html"; }, 800);
}
</script>
</body>
</html>
